<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1a18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Checkmate">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Checkmate Arena</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="logo">♞ Checkmate Arena</div>
    <nav class="nav">
      <button data-view="home"><span class="ni">🏠</span><span class="nl">Home</span><span class="ns">Home</span></button>
      <button data-view="league"><span class="ni">🏆</span><span class="nl">League</span><span class="ns">League</span></button>
      <button data-view="quick"><span class="ni">⚡</span><span class="nl">Quick match</span><span class="ns">Play</span></button>
      <button data-view="leaderboard"><span class="ni">📊</span><span class="nl">Leaderboard</span><span class="ns">Ranks</span></button>
      <button data-view="history"><span class="ni">📜</span><span class="nl">Games</span><span class="ns">Games</span></button>
    </nav>
    <button id="snd" class="sndbtn" aria-label="Toggle sound">🔊</button>
  </header>
  <main id="app"></main>
  <script src="js/chess.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/league.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Installable app: register the service worker (only on real hosting, e.g. GitHub Pages).
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/claude|claudeusercontent/.test(location.hostname)) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.update();
        document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && reg.update());
      }).catch(() => {});
      let reloaded = false;
      const hadController = !!navigator.serviceWorker.controller; // first install is not an "update"
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloaded || !hadController) return;
        reloaded = true;
        const b = document.createElement('div'); b.className = 'updbar';
        b.innerHTML = '<span>A new version is ready.</span><button>Refresh</button><button class="x" aria-label="Dismiss">×</button>';
        b.querySelector('button').onclick = () => location.reload();
        b.querySelector('.x').onclick = () => b.remove();
        document.body.appendChild(b);
      });
    }
  </script>
</body>
</html>
